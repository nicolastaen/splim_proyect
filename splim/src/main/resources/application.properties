spring.application.name=splim
server.port=${PORT:8080}
# Conexion a MySQL local
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/splim?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# STEAM api
steam.api.key=${STEAM_API_KEY:CD77A8D94B132C0F9D45120AA1B56CB6}
steam.api.base-url=${STEAM_API_BASE_URL:https://api.steampowered.com}

# Spring Security - JWT
# IMPORTANTE: cambia este valor en produccion por uno aleatorio largo (min 32 caracteres)
jwt.secret=${JWT_SECRET:splim-clave-secreta-jwt-2026-cambiar-en-produccion}


server.forward-headers-strategy=framework